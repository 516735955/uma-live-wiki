# Include this file from the HTTPS server block that serves umamusumelivewiki.top.
# Update root and upstream only when the deployment directories differ.
root /var/www/umamusume;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding $http_accept_encoding;
    proxy_cache_bypass $http_authorization;
}

location ^~ /uma_tools/vendor/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# These entry bundles are referenced with a version query string by the HTML or
# its loader. A release must update that version whenever the file changes.
location ~* ^/uma_tools/(?:app|app-api|ui-components|character-ui|pedigree-lab|player-controller)\.(?:css|js)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~* ^/(?:uma_tools|data)/.+\.(?:css|js|json)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
}

location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
}

location / {
    try_files $uri $uri/ /赛马娘LIVE相关.html;
    add_header Cache-Control "no-cache" always;
}
