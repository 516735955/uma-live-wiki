<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色页血统关系原型</title>
<link rel="stylesheet" href="/uma_tools/pedigree-lab.css?v=20260911-3">
<script defer src="/data/character_index_data.js?v=20260904"></script>
<script defer src="/data/pedigree_data.js?v=20260911-2"></script>
<script defer src="/uma_tools/pedigree-lab.js?v=20260911-3"></script>
</head>
<body>
<header class="lab-header">
  <a class="lab-brand" id="character-back-link" href="/zh-Hans/database/characters/staygold" aria-label="返回黄金旅程角色页">
    <span>赛马娘演出综合站</span>
  </a>
  <div class="lab-heading">
    <strong>角色页血统关系原型</strong>
    <span>#5第一阶段</span>
  </div>
</header>

<main class="lab-page">
  <section class="lab-controls" aria-label="复杂样本">
    <div class="controls-copy">
      <h1>选择角色查看血统关系</h1>
      <p>四个样本分别覆盖大量同辈、多条后代血统、子代和母马繁育关联。</p>
    </div>
    <div class="lab-samples" role="group" aria-label="复杂样本">
      <button type="button" class="sample-button is-active" data-sample="staygold">
        <span>黄金旅程</span><small>兄弟姐妹最多</small>
      </button>
      <button type="button" class="sample-button" data-sample="akikawayayoi">
        <span>秋川弥生</span><small>后代血统最多</small>
      </button>
      <button type="button" class="sample-button" data-sample="daringheart">
        <span>勇敢之心</span><small>包含子代</small>
      </button>
      <button type="button" class="sample-button" data-sample="nishinoflower">
        <span>西野花</span><small>母马繁育关联</small>
      </button>
    </div>
  </section>

  <section class="lab-workspace is-expanded" aria-labelledby="workspace-title">
    <div class="workspace-head">
      <div>
        <h2 id="workspace-title">黄金旅程的血统关系</h2>
        <p id="workspace-summary">正在载入真实关系数据…</p>
      </div>
      <button type="button" class="collapse-button" data-action="toggle" aria-expanded="true" aria-controls="workspace-content">
        <span>收起血统</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="workspace-content" id="workspace-content">
      <div class="workspace-body">
        <div class="graph-viewport" id="graph-viewport" aria-label="血统关系图">
          <div class="graph-stage" id="graph-stage"></div>
        </div>
        <aside class="relation-inspector" id="relation-inspector" aria-live="polite"></aside>
      </div>
    </div>
  </section>

  <p class="lab-footnote">上方切换角色，模拟从各自角色页展开血统模块。</p>
</main>

<div class="mobile-sheet" id="mobile-sheet" aria-hidden="true">
  <button type="button" class="sheet-backdrop" data-sheet-close aria-label="关闭关系详情"></button>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grip"></div>
    <button type="button" class="sheet-close" data-sheet-close aria-label="关闭">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="sheet-content"></div>
  </section>
</div>
</body>
</html>
