let state={};
const app=document.querySelector('#app'),card=document.querySelector('#card'),selector=document.querySelector('#sample');
Object.entries(pages).forEach(([key,p])=>selector.add(new Option(`${p.kind} · ${p.title}`,key)));
function setState(change){const q=new URLSearchParams({...state,...change});for(const [k,v]of [...q])if(!v)q.delete(k);location.hash=q.toString();}
function read(){const q=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));state={page:'race',mode:'detail',...q};if(!pages[state.page])state.page='race';if(!['directory','detail'].includes(state.mode))state.mode='detail';if(pages[state.page].roles&&!['jockey','trainer'].includes(state.role))state.role='jockey';render();}
function directory(){const rows=Object.entries(pages);return `<p class="crumb">资料库 / 其他 / 样本目录</p><div class="body"><div class="directory-controls"><input id="query" aria-label="搜索目录" placeholder="名称、原名、角色名"><select id="type" aria-label="类型筛选"><option value="">全部类型</option>${[...new Set(rows.map(([,p])=>p.kind))].map(k=>`<option>${e(k)}</option>`).join('')}</select></div><ul class="records" id="directory-list">${rows.map(([k,p])=>`<li data-search="${e(p.title+' '+p.original+' '+(k==='wada'?'好歌剧':k==='club'?'杏目':k==='farm'?'目白高峰 目白赖恩 目白麦昆':k==='fujisawa'?'大树快车 吉兆 荒漠英雄':k==='race'||k==='series'||k==='kyoto'?'成田路 好歌剧 爱慕织姬':''))}" data-kind="${e(p.kind)}"><div class="grow">${go(k,p.title)}<small>${e(p.original)}</small></div><span class="subtle">${e(p.kind)}</span></li>`).join('')}</ul><p id="no-results" class="empty" hidden>没有符合条件的样本。</p></div>`;}
function render(){const p=pages[state.page],v=p.roles?p[state.role]:p,tabs=v.tabs;if(!tabs[state.tab])state.tab=Object.keys(tabs)[0];selector.value=state.page;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));document.title=p.title+' · #13 页面样本';if(state.mode==='directory'){app.innerHTML=directory();card.hidden=true;return;}
app.innerHTML=`<p class="crumb">资料库 / 其他 / ${e(p.kind)} / ${e(p.title)}</p><section class="hero">${p.image?`<img class="hero-image ${p.portrait?'portrait':''}" src="${e(p.image)}" alt="${e(p.title)}官方资料图">`:''}<div class="hero-text"><p class="kind">${e(p.kind)}${p.roles?' · '+(state.role==='trainer'?'调教师':'骑手'):''}</p><h1>${e(p.title)}</h1><p class="original">${e(p.original)}</p><p class="intro">${e(v.intro||p.intro)}</p><div class="keyfacts">${p.keys.map(x=>`<span>${e(x)}</span>`).join('')}</div>${p.roles?`<div class="role switch" aria-label="人物身份"><button data-role="jockey" class="${state.role==='jockey'?'active':''}">骑手</button><button data-role="trainer" class="${state.role==='trainer'?'active':''}">调教师</button></div>`:''}${p.honors?'<div class="honors"><button class="honor" data-honor="complete">完全三冠</button><button class="honor" data-honor="triple">牝马三冠</button><button class="honor" data-honor="hall">殿堂马 · 1987</button></div>':''}<div class="links">${p.sources.map(([s,l])=>link(S[s],l)).join('')}</div></div></section><nav class="tabs" aria-label="页面栏目">${Object.keys(tabs).map(t=>`<button class="tab ${t===state.tab?'active':''}" data-tab="${e(t)}" aria-current="${t===state.tab?'page':'false'}">${e(t)}</button>`).join('')}</nav><section class="body">${tabs[state.tab]()}${refs(p.sources.filter(([s])=>s!=='replay'))}</section>`;
renderCard();}
function renderCard(){const r=races.find(r=>String(r[0])===state.card&&!r[11]);if(!r||state.page!=='race'){card.hidden=true;return;}const parent=parents[r[0]],isRascal=r[0]===3;card.innerHTML=`<button class="close" data-close>关闭</button><h2>${e(r[3])}</h2><p class="original">${e(r[4])}</p>${facts([['出生',isRascal?'1996 年 4 月 17 日':'1996 年（按当场现制三岁，完整生日待核）'],['性别／毛色',isRascal?'牡马 · 鹿毛':'牡马 · 毛色待核'],['产地',isRascal?'北海道平取町 · 稻原牧场':'待核'],['父',parent?e(parent[0]):'待核'],['母',parent?e(parent[1]):'待核']])}<h3>关联赛马娘</h3>${isRascal?related([['silencesuzuka','无声铃鹿','同母兄 · 共同母亲 Wakia（瓦基亚）<br>淘气铃鹿 → 共同母亲 → 无声铃鹿']]):r[0]===5?related([['mejiroryan','目白赖恩','父亲 · 直接亲本关系']]):r[0]===9?related([['symbolirudolf','鲁道夫象征','父亲 · 直接亲本关系']]):'<p class="note">本样本尚未完成既定范围的关系核对，不标作“无关联”。</p>'}<p class="note">${isRascal?'亲缘据双方 JBIS 档案核对；完整祖先、子孙、同父及繁育范围正式入库继续核验。':'中文专名为待核定译名；正式收录按唯一身份与来源核对完整关系范围。'}</p>${refs(isRascal?[['rascal','淘气铃鹿档案'],['suzuka','无声铃鹿档案']]:[['jbisRace','本场马匹资料'],['race','正式结果']])}`;card.hidden=false;}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.mode)setState({mode:b.dataset.mode,card:'',row:''});else if(b.dataset.tab)setState({tab:b.dataset.tab,card:'',row:''});else if(b.dataset.role){const tabs=pages[state.page][b.dataset.role].tabs;setState({role:b.dataset.role,tab:tabs[state.tab]?state.tab:'资料',card:'',row:''});}else if(b.dataset.row)setState({row:state.row===b.dataset.row?'':b.dataset.row});else if(b.dataset.card)setState({card:b.dataset.card});else if(b.hasAttribute('data-close'))setState({card:''});else if(b.dataset.honor){setState({tab:'资料',honor:b.dataset.honor});}});
selector.addEventListener('change',()=>setState({page:selector.value,tab:'',role:'',row:'',card:'',honor:''}));
function filter(){const q=document.querySelector('#query'),t=document.querySelector('#type');if(!q)return;let n=0;document.querySelectorAll('#directory-list li').forEach(li=>{li.hidden=!li.dataset.search.toLowerCase().includes(q.value.trim().toLowerCase())||(t.value&&li.dataset.kind!==t.value);if(!li.hidden)n++;});document.querySelector('#no-results').hidden=n>0;}
document.addEventListener('input',ev=>{if(ev.target.id==='query')filter();});document.addEventListener('change',ev=>{if(ev.target.id==='type')filter();});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!card.hidden)setState({card:''});});
document.addEventListener('error',ev=>{const img=ev.target;if(!(img instanceof HTMLImageElement))return;img.hidden=true;const a=img.closest('figure a');if(a)a.textContent='官方图片暂未载入 · 查看原图';},true);
window.addEventListener('hashchange',()=>{read();if(state.honor){const d=document.querySelector('#honor-'+state.honor);if(d){d.open=true;d.scrollIntoView({block:'center'});}else if(state.honor==='hall'){const h=[...document.querySelectorAll('h2')].find(x=>x.textContent==='殿堂马');h?.scrollIntoView({block:'center'});}}});
read();
</script>
</body>
</html>
