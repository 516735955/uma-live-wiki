name: sheet-sync

# 唯一的 Google Sheet 写入链路：仅补唯一匹配的空白歌单。
# 已有非空资料的差异只记录到工作流报告，留待人工处理；不发邮件。
on:
  schedule:
    - cron: '16 2 * * *'        # 每天 02:16 UTC（北京时间 10:16）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl Pillow

      - name: Sync setlists from official Google Sheet
        run: python uma_tools/auto_setlists.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Rebuild catalog if sheet sync filled a blank setlist
        run: |
          if git status --porcelain -- data/live_cat_data.json | grep -q .; then
            echo "Sheet sync changed sources; rebuilding catalog..."
            python uma_tools/update_events.py
          else
            echo "No setlist changes; skipping rebuild."
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: Review skipped and conflicting rows
        if: always()
        run: |
          if test -f data/events/sheet_apply_report.json; then
            python -c "import json; r=json.load(open('data/events/sheet_apply_report.json')); print('Filled:',len(r['filled']),'Review:',len(r['review'])); [print(x) for x in r['review']]"
          fi

      - name: Commit generated data (if changed)
        run: |
          git add data/live_cat_data.json data/events_catalog.json data/events_data.json data/song_catalog.json data/appearance_index.json data/catalog_manifest.json data/voice_actor_profiles.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(events): auto sync sheet setlists $(date -u +%Y-%m-%d)"
            git push
          fi
