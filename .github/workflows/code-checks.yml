name: Code checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix uma_tools --include=dev --no-audit --no-fund
      - name: Core catalog, server, and release checks
        run: |
          node uma_tools/test_catalog_store.js
          npm --prefix uma_tools run test:routes
          node uma_tools/test_frontend_regressions.js
          node uma_tools/test_api_regressions.js
          node deploy/test_release.js
          node deploy/test_data_sync.js
          bash -n deploy/update.sh
