name: event-sync

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间03:00，在04:00平滑部署前同步
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: event-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      BAIDU_APPID: ${{ secrets.BAIDU_APPID }}
      BAIDU_SECRET: ${{ secrets.BAIDU_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline search build dependency
        run: npm ci --prefix uma_tools --ignore-scripts
      - name: Install existing collection dependencies
        run: python -m pip install Pillow beautifulsoup4 openpyxl yt-dlp
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/auto_update
            uma_tools/img/event-cache
          key: event-sources-${{ runner.os }}-${{ github.run_id }}
          restore-keys: event-sources-${{ runner.os }}-
      - name: Discover, reconcile and localize incremental event data
        id: collect
        continue-on-error: true
        run: python uma_tools/sync_knowledge.py --force --only events programs catalogs event-localization event-images entity-localization
      - name: Verify complete usable catalogs
        run: |
          npm run --prefix uma_tools build:search-pronunciations
          python uma_tools/update_events.py --check
          node uma_tools/test_catalog_store.js
      - name: Publish verified source changes to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python uma_tools/publish_event_sources.py
      - name: Retain successful downloads even when another source failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/auto_update
            uma_tools/img/event-cache
          key: event-sources-${{ runner.os }}-${{ github.run_id }}
      - name: Report incomplete sources without discarding healthy updates
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          python uma_tools/sync_knowledge.py --status
          test "$COLLECTION_OUTCOME" = success
